[package]
name = "scandesk"
version = "1.0.0"
description = "Private, offline-first QR and barcode scanner suite"
authors = ["Shayan Shah"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
